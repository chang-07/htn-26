<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Plan: an agent in your iMessage group chat that finds the place, runs the vote, books the winner and builds the carts." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Paint the right ground before React mounts, so nothing flashes white.
      // The ticket pages are always cream; the run viewer is cream by day and
      // ink by night, and remembers which it was last set to.
      (function () {
        var paper = "#efe7d6", ink = "#241f17", ground = paper;
        if (location.pathname.startsWith("/runs")) {
          var saved = null;
          try { saved = localStorage.getItem("runs.theme"); } catch (e) {}
          var dark = saved ? saved === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
          ground = dark ? ink : paper;
        }
        document.documentElement.style.background = ground;
      })();
    </script>
    <title>Plan</title>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
