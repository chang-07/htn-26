<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Whim: an agent in your iMessage group chat that finds the place, runs the vote, books the winner and builds the carts." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      // Paint the right ground before React mounts, so nothing flashes white.
      // The ticket pages are always cream; the run viewer is white unless it was
      // last set to night.
      (function () {
        var ground = "#efe7d6";
        if (location.pathname.startsWith("/runs")) {
          var saved = null;
          try { saved = localStorage.getItem("runs.theme"); } catch (e) {}
          ground = saved === "dark" ? "#0b1013" : "#ffffff";
        }
        document.documentElement.style.background = ground;
      })();
    </script>
    <title>Whim</title>
  </head>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
